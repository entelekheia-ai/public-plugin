name: release

# Versions only — nothing here publishes to a registry. A plugin's version lives in its package.json;
# on each push to main with pending changesets, this opens or updates a "Version Packages" pull request
# whose `npm run version` applies them and syncs each version into plugin.json and marketplace.json.
# Merging that pull request is the release; `claude plugin tag <plugin>` then marks it, by hand.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
